<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Z Store — تم استلام طلبك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#061729;
    --surface:#0a2238;
    --line:#173b58;
    --cyan:#19c5ff;
    --blue:#1688f5;
    --text:#f7fbff;
    --muted:#a9bfd1;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 50% 0%, #0b3150 0%, var(--bg) 48%, #04111f 100%);
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:480px;
    width:100%;
    background:linear-gradient(180deg, rgba(11,39,64,.98), rgba(7,28,47,.98));
    border:1px solid var(--line);
    border-radius:24px;
    padding:44px 32px;
    text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.75), 0 0 35px rgba(25,197,255,.08);
  }
  .brand{
    color:var(--cyan);
    font-size:.95rem;
    font-weight:900;
    letter-spacing:.5px;
    margin-bottom:26px;
  }
  .check{
    width:74px; height:74px;
    border-radius:50%;
    background:rgba(25,197,255,.12);
    border:2px solid var(--cyan);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 24px;
    font-size:2.2rem; font-weight:900;
    color:var(--cyan);
  }
  h1{
    font-size:1.5rem;
    font-weight:900;
    margin-bottom:14px;
  }
  p{
    color:var(--muted);
    line-height:1.7;
    margin-bottom:10px;
  }
  a.back{
    display:inline-block;
    margin-top:22px;
    color:var(--cyan);
    text-decoration:none;
    font-weight:700;
    border:0;
    padding:12px 28px;
    border-radius:100px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Big Z Store</div>
    <div class="check">✓</div>
    <h1>شكرًا لك، تم استلام طلبك بنجاح</h1>
    <p>سيتصل بك أحد ممثلي خدمة العملاء قريبًا لتأكيد الطلب قبل الشحن.</p>
    <p>الدفع سيكون نقدًا عند استلام المنتج.</p>
    <a class="back" href="index.html">العودة للصفحة الرئيسية</a>
  </div>
</body>
</html>

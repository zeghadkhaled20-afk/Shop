<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Z Store — تم استلام طلبك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141a;
    --surface:#1c2028;
    --line:#2c313d;
    --orange:#ff6a1a;
    --text:#f4f1ea;
    --muted:#9aa1ad;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:480px;
    width:100%;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:24px;
    padding:44px 32px;
    text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  }
  .check{
    width:74px; height:74px;
    border-radius:50%;
    background:rgba(255,106,26,.15);
    border:2px solid var(--orange);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 24px;
    font-size:2rem;
    color:var(--orange);
  }
  h1{
    font-size:1.5rem;
    font-weight:900;
    margin-bottom:14px;
  }
  p{
    color:var(--muted);
    line-height:1.7;
    margin-bottom:10px;
  }
  a.back{
    display:inline-block;
    margin-top:22px;
    color:var(--orange);
    text-decoration:none;
    font-weight:700;
    border:1.5px solid var(--orange);
    padding:12px 28px;
    border-radius:100px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>شكرًا لك، تم استلام طلبك بنجاح</h1>
    <p>سيتصل بك أحد ممثلي خدمة العملاء قريبًا لتأكيد الطلب قبل الشحن.</p>
    <p>الدفع سيكون نقدًا عند استلام المنتج.</p>
    <a class="back" href="index.html">العودة للصفحة الرئيسية</a>
  </div>
</body>
</html>
